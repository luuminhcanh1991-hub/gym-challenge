name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm thử luật chơi & tiền phạt
        run: |
          bash supabase/tests/run.sh | tee result.txt
          bash supabase/tests/20_concurrency.sh | tee -a result.txt
          if grep -qE 'FAIL|ERROR' result.txt; then exit 1; fi
          echo "PASS: $(grep -c PASS result.txt) test"

  build:
    needs: test-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Base path
        # Repo tên <owner>.github.io → site ở gốc "/", còn lại → "/<repo>/"
        run: |
          R="${{ github.event.repository.name }}"
          if [[ "$R" == *.github.io ]]; then echo "BASE_PATH=/" >> $GITHUB_ENV; else echo "BASE_PATH=/$R/" >> $GITHUB_ENV; fi
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          sed -i "s#__BASE_PATH__#$BASE_PATH#" dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
